<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="zero_one_logic.js"></script>
    <title>Document</title>
</head>
<body>
    <div>
        <h2>01 Game</h2>

        <label>Start Score:</label>
        <select id="startScore">
            <option value="301">301</option>
            <option value="501">501</option>
            <option value="701">701</option>
        </select>
        <button onclick="startGame()">Start</button>

        <h3 id="currentScore">Score: -</h3>

        <input id="throw1" type="number" placeholder="1st" />
        <input id="throw2" type="number" placeholder="2nd" />
        <input id="throw3" type="number" placeholder="3rd" />

        <button onclick="submitRound()">Submit Round</button>

        <h3 id="result"></h3>
    </div>

</body>
</html>
