<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="home.js"></script>
    <title>Darts Score App</title>

    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            text-align: center;
            background: #f4f4f4;
            padding: 40px 20px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #333;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 30px;
            color: #666;
        }

        .mode-btn {
            width: 80%;
            max-width: 300px;
            padding: 18px;
            margin: 12px auto;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            background: #0078ff;
            color: white;
            cursor: pointer;
            display: block;
            transition: 0.15s;
        }

        .mode-btn:hover {
            background: #005fcc;
        }

        .mode-btn:active {
            transform: scale(0.97);
        }

        .disabled {
            background: #aaa;
            cursor: default;
        }

        /* フィードバックボタン */
        .feedback-btn {
            margin-top: 30px;
            padding: 12px 20px;
            background: #0078d4;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        /* モーダル背景 */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
        }

        /* モーダル内容 */
        .modal-content {
            background: #fff;
            margin: 20% auto;
            padding: 20px;
            width: 85%;
            max-width: 400px;
            border-radius: 12px;
            text-align: center;
        }

        /* 閉じるボタン */
        .close {
            float: right;
            font-size: 22px;
            cursor: pointer;
        }

        /* フォームを開くボタン */
        .form-btn {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 16px;
            background: #0078d4;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Darts Score App</h1>
    <h2>モードを選択</h2>

    <button class="mode-btn" onclick="selectMode('01')">01 GAME</button>
    <button class="mode-btn" onclick="selectMode('cricket')">CRICKET</button>
    <button class="mode-btn disabled">COUNT UP（未実装）</button>

    <!-- フィードバックボタン -->
    <button id="openFeedbackModal" class="feedback-btn">フィードバック</button>

    <!-- モーダル本体 -->
    <div id="feedbackModal" class="modal">
        <div class="modal-content">
            <span id="closeFeedbackModal" class="close">&times;</span>
            <h3>フィードバック</h3>
            <p>改善点や要望があれば、以下のフォームから送信してください。</p>

            <a href="https://docs.google.com/forms/d/e/1FAIpQLSerd4imlRn39rJphkqa3vPL93ITts1oYyt4wySBd-Fvy06tbQ/viewform"
               target="_blank"
               class="form-btn">
                フィードバックフォームを開く
            </a>
        </div>
    </div>

    <script>
        const modal = document.getElementById("feedbackModal");
        const openBtn = document.getElementById("openFeedbackModal");
        const closeBtn = document.getElementById("closeFeedbackModal");

        openBtn.onclick = () => {
            modal.style.display = "block";
        };

        closeBtn.onclick = () => {
            modal.style.display = "none";
        };

        window.onclick = (event) => {
            if (event.target === modal) {
                modal.style.display = "none";
            }
        };
    </script>

</body>
</html>
